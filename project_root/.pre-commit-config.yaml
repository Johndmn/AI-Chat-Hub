repos:
- repo: https://github.com/psf/black
  rev: stable
  hooks:
    - id: black
      args: ["--line-length=88"]

- repo: https://github.com/PyCQA/isort
  rev: stable
  hooks:
    - id: isort

- repo: https://github.com/pre-commit/mirrors-autoflake
  rev: stable
  hooks:
    - id: autoflake
      args: ["--remove-all-unused-imports", "--recursive", "--in-place"]

- repo: https://github.com/PyCQA/flake8
  rev: 6.1.0
  hooks:
    - id: flake8
