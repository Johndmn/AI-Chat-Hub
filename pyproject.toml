[tool.black]
line-length = 88
target-version = ["py311"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 88
force_single_line = false
multi_line_output = 3
include_trailing_comma = true
combine_as_imports = true

[flake8]
max-line-length = 88
extend-ignore = [
    "E203",  # несовместим с black
    "W503",  # несовместим с black
]
